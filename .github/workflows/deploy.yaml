name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # needed for passwordless AWS login (OIDC)
  contents: read

env:
  AWS_REGION: ap-south-1
  PROJECT: url-shortener
  ENV_NAME: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Step 1: log in to AWS with the role from the cicd stack
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: zip the code
      - name: Build bundle
        run: |
          echo "VERSION=${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          zip -r bundle.zip src Procfile package.json package-lock.json

      # Step 3: upload the zip to S3 and tell Beanstalk about this version
      - name: Upload and register version
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT}-${ENV_NAME}-app" \
            --query "Stacks[0].Outputs[?OutputKey=='VersionsBucket'].OutputValue" --output text)
          aws s3 cp bundle.zip "s3://${BUCKET}/${PROJECT}/${VERSION}.zip"
          aws elasticbeanstalk create-application-version \
            --application-name "${PROJECT}-${ENV_NAME}" \
            --version-label "$VERSION" \
            --source-bundle "S3Bucket=${BUCKET},S3Key=${PROJECT}/${VERSION}.zip"

      # Step 4: tell the environment to run that version, and wait until done
      - name: Deploy
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${PROJECT}-${ENV_NAME}-api" --version-label "$VERSION"
          aws elasticbeanstalk wait environment-updated \
            --application-name "${PROJECT}-${ENV_NAME}" \
            --environment-names "${PROJECT}-${ENV_NAME}-api"